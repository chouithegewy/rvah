[workspace]
resolver = "2"
members = ["crates/*"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
semver = { version = "1", features = ["serde"] }
thiserror = "2"
url = "2"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
aes-gcm = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
tar = "0.4"
flate2 = "1"
ureq = "2"
hex = "0.4"
tempfile = "3"
wasmtime = "36.0.7"
eframe = "0.29"
proptest = "1"

rvah-addon-sdk = { path = "crates/rvah-addon-sdk" }
rvah-addon-host = { path = "crates/rvah-addon-host" }
rvah-net = { path = "crates/rvah-net" }
rvah-data = { path = "crates/rvah-data" }
rvah-auth = { path = "crates/rvah-auth" }
rvah-player = { path = "crates/rvah-player" }
rvah-core = { path = "crates/rvah-core" }
rvah-testkit = { path = "crates/rvah-testkit" }
rvah-player-mpv = { path = "crates/rvah-player-mpv" }
rvah-ui = { path = "crates/rvah-ui" }
rvah-repo = { path = "crates/rvah-repo" }
