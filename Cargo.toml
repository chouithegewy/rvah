[workspace]
resolver = "2"
members = ["crates/*"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
secret-service = { version = "5", features = ["rt-async-io-crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
semver = { version = "1", features = ["serde"] }
thiserror = "2"
url = "2"
sha2 = "0.10"
hmac = "0.12"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
aes-gcm = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
tar = "0.4"
flate2 = "1"
# Add-on HTTP: HTTP/2 when a server offers it (some sites refuse HTTP/1.1).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "http2"] }
hex = "0.4"
tempfile = "3"
wasmtime = "47.0.4"
wasmi = "0.46.0"
uniffi = "0.32.0"
# Network filtering for the Android TV web player. Without `single-thread`
# the engine is Send + Sync.
adblock = { version = "0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
eframe = "0.29"
proptest = "1"
raw-window-handle = "0.6"
winit = "0.30"
x11-dl = "2"
zeroize = "1"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
console_error_panic_hook = "0.1"

rvah-addon-sdk = { path = "crates/rvah-addon-sdk" }
rvah-addon-host = { path = "crates/rvah-addon-host" }
rvah-net = { path = "crates/rvah-net" }
rvah-data = { path = "crates/rvah-data" }
rvah-auth = { path = "crates/rvah-auth" }
rvah-player = { path = "crates/rvah-player" }
rvah-core = { path = "crates/rvah-core" }
rvah-testkit = { path = "crates/rvah-testkit" }
rvah-player-mpv = { path = "crates/rvah-player-mpv" }
rvah-ui = { path = "crates/rvah-ui" }
rvah-repo = { path = "crates/rvah-repo" }
rvah-profile = { path = "crates/rvah-profile", default-features = false }
rvah-sync = { path = "crates/rvah-sync" }
rvah-stream-relay = { path = "crates/rvah-stream-relay" }
