name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Test
        run: cargo test --workspace

  addons:
    name: add-on (${{ matrix.addon }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon: [discover, prowlarr, real-debrid, subdl, tmdb, trakt]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Test natively
        run: cargo test --locked --manifest-path examples/addons/${{ matrix.addon }}/Cargo.toml
      - name: Build WebAssembly guest
        run: cargo build --locked --release --target wasm32-unknown-unknown --manifest-path examples/addons/${{ matrix.addon }}/Cargo.toml

  addon-integration:
    name: add-on host integration
    needs: addons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Stage WebAssembly guests
        run: |
          sh examples/addons/discover/build.sh
          PROWLARR_URL=https://prowlarr.example.com sh examples/addons/prowlarr/build.sh
          sh examples/addons/real-debrid/build.sh
          sh examples/addons/subdl/build.sh
          sh examples/addons/tmdb/build.sh
          sh examples/addons/trakt/build.sh
      - name: Exercise guests through the Android host
        run: cargo test --locked -p rvah-android --tests -- --ignored

  web-wasm:
    name: web + WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Install browser dependencies
        working-directory: web
        run: npm ci
      - name: Check browser sources
        working-directory: web
        run: |
          npm run check
          npm run test:mock-veilid
      - name: Test browser Rust boundaries
        run: cargo test --locked -p rvah-web --lib -p rvah-stream-relay
      - name: Test and build Veilid metadata add-on
        run: |
          cargo test --locked --manifest-path examples/addons/veilid/Cargo.toml
          sh examples/addons/veilid/build.sh
      - name: Build production PWA
        working-directory: web
        run: npm run build
      - name: Smoke test production PWA
        working-directory: web
        run: node scripts/browser-smoke.mjs
      - name: Upload static web build
        uses: actions/upload-artifact@v7
        with:
          name: rvah-web
          path: web/dist

  audit:
    name: licenses + advisories (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  sbom:
    name: SBOM (cargo-cyclonedx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate CycloneDX SBOMs
        run: cargo cyclonedx --format json
      - name: Upload SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: crates/*/*.cdx.json

  wasm-sandbox:
    name: test (wasm feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test all features
        run: cargo test --workspace --all-features
      - name: Clippy all features
        run: cargo clippy --workspace --all-features -- -D warnings
