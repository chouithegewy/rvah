[package]
name = "rvah-addon-host"
description = "Manifest parsing, package verification, runtime, and add-on lifecycle for RVAH"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rvah-addon-sdk.workspace = true
rvah-auth = { workspace = true, optional = true }
rvah-data = { workspace = true, optional = true }
rvah-net = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
semver.workspace = true
thiserror.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
tar.workspace = true
flate2.workspace = true
hex.workspace = true
wasmtime = { workspace = true, optional = true }
wasmi = { workspace = true, optional = true }

[features]
default = ["native"]
native = ["dep:rvah-auth", "dep:rvah-data", "dep:rvah-net"]
wasm = ["dep:wasmtime"]
wasm-wasmi = ["dep:wasmi"]

[dev-dependencies]
tempfile.workspace = true
# The guest's wire types, checked against the host's.
rvah-addon-sdk = { workspace = true, features = ["guest"] }
proptest = { workspace = true }
