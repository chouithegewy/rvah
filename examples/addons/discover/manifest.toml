[addon]
id = "com.rvah.discover"
name = "RVAH Discover"
version = "0.2.0"
sdk = ">=0.1, <0.2"
entry = "module.wasm"
# TMDB (titles, details, ratings via MDBList) and Trakt (your
# recommendations, sign-in, scrobbling), nested as components.
capabilities = ["catalog", "search", "details", "auth", "account_status", "scrobble"]

[permissions]
network = [
    "api.themoviedb.org", "image.tmdb.org", "api.mdblist.com",
    "api.trakt.tv", "media.trakt.tv", "walter-r2.trakt.tv",
]
storage = "64KiB"
# TMDB: tmdb_key, and mdblist_key for ratings. Trakt: client_id, and the
# access_token / refresh_token Link account writes.
secrets = ["tmdb_key", "mdblist_key", "client_id", "access_token", "refresh_token"]

[settings]
region = { type = "string", default = "US" }
language = { type = "string", default = "en-US" }
# Your Trakt app's redirect URI; build.sh sets it from TRAKT_REDIRECT_URI.
redirect_uri = { type = "string", default = "urn:ietf:wg:oauth:2.0:oob" }
# Genre columns after the streaming and Trakt ones, in this order.
genres = { type = "list", default = "Sci-Fi,Anime,Thriller,Action,Comedy,Horror,Drama,Mystery,Crime,Fantasy,Documentary,Romance", enum = ["Sci-Fi", "Anime", "Thriller", "Action", "Comedy", "Horror", "Drama", "Mystery", "Crime", "Fantasy", "Animation", "Documentary", "Romance", "Family", "War", "Western", "History", "Music", "Kids", "Reality"] }
