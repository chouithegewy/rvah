[package]
name = "rvah-addon-trakt"
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "RVAH add-on: your Trakt watchlist and recommendations, and scrobbling"

[lib]
# cdylib for the wasm module; rlib so the logic unit-tests natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
rvah-addon-sdk = { path = "../../../crates/rvah-addon-sdk", features = ["guest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Standalone crate: not part of the host workspace.
[workspace]

[profile.release]
opt-level = "s"
lto = true
strip = true
